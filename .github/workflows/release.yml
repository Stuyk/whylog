name: release

# Cut a release from the CLI by pushing a tag:
#   git tag v1.0.1 && git push origin v1.0.1
# The tag is the version. The workflow stamps it into Cargo.toml before building, so the
# binary reports it (`whylog version`). Binaries for linux/macOS/windows (amd64 + arm64) and
# checksums.txt are attached to the GitHub Release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Version from tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::tag $GITHUB_REF_NAME is not v<semver> (e.g. v1.0.1)"; exit 1; }
          cargo_v="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          [ "$tag" = "$cargo_v" ] || echo "::notice::Cargo.toml says $cargo_v; building as $tag from the tag"
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: make smoke

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-latest,    name: linux_amd64,   musl: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, name: linux_arm64,   musl: true }
          - { target: x86_64-apple-darwin,        os: macos-latest,     name: darwin_amd64 }
          - { target: aarch64-apple-darwin,       os: macos-latest,     name: darwin_arm64 }
          - { target: x86_64-pc-windows-msvc,     os: windows-latest,   name: windows_amd64, exe: .exe }
          - { target: aarch64-pc-windows-msvc,    os: windows-latest,   name: windows_arm64, exe: .exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Stamp version from tag
        shell: bash
        run: perl -pi -e 's/^version = ".*"/version = "${{ needs.verify.outputs.version }}"/ if $. < 10' Cargo.toml
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          v="${{ needs.verify.outputs.version }}"
          base="whylog_${v}_${{ matrix.name }}"
          # Stage outside dist/ so only finished archives ever land there.
          stage="stage/$base"
          mkdir -p "$stage" dist
          cp "target/${{ matrix.target }}/release/whylog${{ matrix.exe }}" README.md LICENSE "$stage/"
          if [ -n "${{ matrix.exe }}" ]; then
            (cd "$stage" && 7z a -tzip "../../dist/$base.zip" whylog.exe README.md LICENSE >/dev/null)
          else
            tar -czf "dist/$base.tar.gz" -C "$stage" whylog README.md LICENSE
          fi
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          shopt -s nullglob
          files=(whylog_*.tar.gz whylog_*.zip)
          [ ${#files[@]} -eq 6 ] || { echo "::error::expected 6 archives, got ${#files[@]}: ${files[*]}"; ls -la; exit 1; }
          sha256sum "${files[@]}" > checksums.txt
          cat checksums.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/checksums.txt \
            --title "whylog $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
